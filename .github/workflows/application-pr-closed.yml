name: application PR close handler

on:
  pull_request:
    branches:
      - master
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: podinfo-lab-a-delivery
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/emrht/podinfo-emrah
  IAC_REPOSITORY: EmrhT/ultimate-iac
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  APPLICATION_PR: ${{ github.event.pull_request.number }}

jobs:
  promote-production:
    name: Request manual production promotion
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Checkout trusted promotion helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the tested feature image
        id: image
        run: |
          image_tag="sha-$SOURCE_SHA"
          image_digest=$(.github/scripts/resolve-image-digest.sh \
            "$IMAGE_REPOSITORY:$image_tag")
          echo "tag=$image_tag" >>"$GITHUB_OUTPUT"
          echo "digest=$image_digest" >>"$GITHUB_OUTPUT"
          echo "Promoting $IMAGE_REPOSITORY@$image_digest from application PR #$APPLICATION_PR"

      - name: Verify the successful dev security validation artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          artifact_name="promotion-decision-pr-${APPLICATION_PR}-${SOURCE_SHA}"
          artifact_id=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id')
          [[ $artifact_id =~ ^[0-9]+$ ]] || {
            echo "no unexpired successful dev validation artifact named $artifact_name" >&2
            exit 1
          }

          mkdir -p promotion-decision
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            >promotion-decision.zip
          unzip -q promotion-decision.zip -d promotion-decision

          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg pr "$APPLICATION_PR" \
            --arg source_sha "$SOURCE_SHA" \
            --arg image_repository "$IMAGE_REPOSITORY" \
            --arg image_digest "$IMAGE_DIGEST" \
            '.repository == $repository and
             .application_pr == ($pr | tonumber) and
             .source_sha == $source_sha and
             .image_repository == $image_repository and
             .image_digest == $image_digest and
             .environment == "lab-a-dev" and
             .dast == "success"' \
            promotion-decision/dev-security-validation.json >/dev/null

      - name: Mark the exact digest as the latest accepted build
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE_REPOSITORY:accepted" \
            "$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          accepted_digest=$(.github/scripts/resolve-image-digest.sh \
            "$IMAGE_REPOSITORY:accepted")
          [[ $accepted_digest == "$IMAGE_DIGEST" ]] || {
            echo "accepted tag resolved to $accepted_digest instead of $IMAGE_DIGEST" >&2
            exit 1
          }

      - name: Create scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.IAC_PROMOTER_CLIENT_ID }}
          private-key: ${{ secrets.IAC_PROMOTER_PRIVATE_KEY }}
          owner: EmrhT
          repositories: ultimate-iac
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout GitOps repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.IAC_REPOSITORY }}
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: ultimate-iac

      - name: Update only the lab-a production digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cd ultimate-iac
          ../.github/scripts/update-podinfo-digest.sh \
            argocd/applications/podinfo/clusters/lab-a/prod/kustomization.yaml \
            "$IMAGE_DIGEST"
          kubectl kustomize argocd/applications/podinfo/clusters/lab-a/prod >/dev/null
          changed=$(git diff --name-only)
          [[ -z $changed || $changed == "argocd/applications/podinfo/clusters/lab-a/prod/kustomization.yaml" ]] || {
            echo "unexpected GitOps changes: $changed" >&2
            exit 1
          }

      - name: Open or update the production promotion PR
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: ultimate-iac
          base: main
          branch: promote/podinfo-lab-a-prod
          delete-branch: true
          commit-message: Promote accepted podinfo PR ${{ env.APPLICATION_PR }} to lab-a prod
          title: Promote accepted podinfo PR #${{ env.APPLICATION_PR }} to lab-a prod
          body: |
            Manual production promotion for accepted application PR #${{ env.APPLICATION_PR }}.

            Application PR: `${{ github.event.pull_request.html_url }}`
            Source: `${{ github.repository }}@${{ env.SOURCE_SHA }}`
            Image: `${{ env.IMAGE_REPOSITORY }}@${{ steps.image.outputs.digest }}`

            This is the exact digest that passed the application PR delivery gate in dev.
            Approval by `@EmrhT` and a manual merge are required.
          add-paths: |
            argocd/applications/podinfo/clusters/lab-a/prod/kustomization.yaml

      - name: Summarize the manual production decision
        env:
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          if [[ -n $PR_NUMBER ]]; then
            {
              echo "### Manual production merge required"
              echo
              echo "Review and manually merge [GitOps PR #${PR_NUMBER}](${PR_URL})."
              echo
              echo "Image: \`${IMAGE_REPOSITORY}@${IMAGE_DIGEST}\`"
            } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "Production already references \`${IMAGE_REPOSITORY}@${IMAGE_DIGEST}\`." \
              >>"$GITHUB_STEP_SUMMARY"
          fi

  rollback-rejected-dev:
    name: Reconcile dev after rejected application PR
    if: >-
      github.event.pull_request.merged == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout trusted rollback helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Create scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.IAC_PROMOTER_CLIENT_ID }}
          private-key: ${{ secrets.IAC_PROMOTER_PRIVATE_KEY }}
          owner: EmrhT
          repositories: ultimate-iac
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout GitOps repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.IAC_REPOSITORY }}
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: ultimate-iac

      - name: Reconcile dev only when it still runs the rejected digest
        id: rollback
        run: |
          rejected_tag="sha-$SOURCE_SHA"
          if ! rejected_digest=$(.github/scripts/resolve-image-digest.sh \
            "$IMAGE_REPOSITORY:$rejected_tag"); then
            echo "The rejected PR did not publish an image; no dev rollback is required."
            echo "needed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          dev_file=ultimate-iac/argocd/applications/podinfo/clusters/lab-a/dev/kustomization.yaml
          prod_file=ultimate-iac/argocd/applications/podinfo/clusters/lab-a/prod/kustomization.yaml
          current_dev_digest=$(sed -nE \
            's/^[[:space:]]*digest: (sha256:[0-9a-f]{64})$/\1/p' "$dev_file")
          fallback_digest=$(sed -nE \
            's/^[[:space:]]*digest: (sha256:[0-9a-f]{64})$/\1/p' "$prod_file")

          if [[ $current_dev_digest != "$rejected_digest" ]]; then
            echo "Dev no longer runs the rejected digest; leaving the newer deployment untouched."
            echo "needed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if accepted_digest=$(.github/scripts/resolve-image-digest.sh \
            "$IMAGE_REPOSITORY:accepted" 2>/dev/null); then
            rollback_digest=$accepted_digest
          else
            rollback_digest=$fallback_digest
          fi

          [[ $rollback_digest =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "could not resolve a safe accepted rollback digest" >&2
            exit 1
          }

          if [[ $rollback_digest == "$current_dev_digest" ]]; then
            echo "Dev already runs the accepted digest."
            echo "needed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          cd ultimate-iac
          ../.github/scripts/update-podinfo-digest.sh \
            argocd/applications/podinfo/clusters/lab-a/dev/kustomization.yaml \
            "$rollback_digest"
          kubectl kustomize argocd/applications/podinfo/clusters/lab-a/dev >/dev/null
          changed=$(git diff --name-only)
          [[ $changed == "argocd/applications/podinfo/clusters/lab-a/dev/kustomization.yaml" ]] || {
            echo "unexpected GitOps rollback changes: $changed" >&2
            exit 1
          }
          echo "needed=true" >>"$GITHUB_OUTPUT"
          echo "digest=$rollback_digest" >>"$GITHUB_OUTPUT"

      - name: Open the dev rollback PR
        if: steps.rollback.outputs.needed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: ultimate-iac
          base: main
          branch: promote/podinfo-lab-a-dev
          delete-branch: true
          commit-message: Roll back rejected podinfo PR ${{ env.APPLICATION_PR }} from lab-a dev
          title: Roll back rejected podinfo PR #${{ env.APPLICATION_PR }} from lab-a dev
          body: |
            Automated dev reconciliation after application PR #${{ env.APPLICATION_PR }} was closed without merging.

            Rejected source: `${{ github.repository }}@${{ env.SOURCE_SHA }}`
            Restored image: `${{ env.IMAGE_REPOSITORY }}@${{ steps.rollback.outputs.digest }}`

            The rollback was created only because dev still referenced the rejected digest.
          add-paths: |
            argocd/applications/podinfo/clusters/lab-a/dev/kustomization.yaml

      - name: Automatically merge the safe dev rollback
        if: steps.rollback.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          if [[ -n $PR_NUMBER ]]; then
            gh pr merge "$PR_NUMBER" --repo "$IAC_REPOSITORY" --auto --squash
          fi
