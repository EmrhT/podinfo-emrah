name: application PR delivery

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: podinfo-lab-a-delivery
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/emrht/podinfo-emrah
  SONAR_HOST_URL: https://ci-sonarqube.no-name.win
  TRIVY_SERVER_URL: https://ci-trivy.no-name.win
  ZAP_API_URL: https://ci-zap.no-name.win
  DEFECTDOJO_URL: https://ci-dojo.no-name.win
  ARGOCD_SERVER: ci-argocd.no-name.win
  IAC_REPOSITORY: EmrhT/ultimate-iac
  ARGOCD_VERSION: v3.4.2
  TRIVY_VERSION: v0.73.0
  TRIVY_ENFORCE: "false"
  DEFECTDOJO_ENFORCE: "false"
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  APPLICATION_PR: ${{ github.event.pull_request.number }}

jobs:
  quality:
    name: Unit tests and SAST
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Reclaim runner disk space
        uses: ./.github/actions/runner-cleanup

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache-dependency-path: |
            **/go.sum
            **/go.mod

      - name: Run unit tests with coverage
        run: make test

      - name: Prepare SonarQube mTLS settings
        env:
          SONAR_MTLS_PKCS12_BASE64: ${{ secrets.SONAR_MTLS_PKCS12_BASE64 }}
          SONAR_MTLS_KEYSTORE_PASSWORD: ${{ secrets.SONAR_MTLS_KEYSTORE_PASSWORD }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/sonarqube"
          printf '%s' "$SONAR_MTLS_PKCS12_BASE64" \
            | base64 --decode >"$RUNNER_TEMP/sonarqube/client.p12"
          chmod 600 "$RUNNER_TEMP/sonarqube/client.p12"

          escape_property() {
            local value=$1
            value=${value//\\/\\\\}
            value=${value//$'\n'/\\n}
            value=${value//$'\r'/\\r}
            value=${value//$'\t'/\\t}
            value=${value// /\\ }
            value=${value//:/\\:}
            value=${value//=/\\=}
            value=${value//#/\\#}
            value=${value//!/\\!}
            printf '%s' "$value"
          }

          cp sonar-project.properties "$RUNNER_TEMP/sonar-project.properties"
          printf '\nsonar.scanner.keystorePath=%s\nsonar.scanner.keystorePassword=%s\n' \
            "$RUNNER_TEMP/sonarqube/client.p12" \
            "$(escape_property "$SONAR_MTLS_KEYSTORE_PASSWORD")" \
            >>"$RUNNER_TEMP/sonar-project.properties"

      - name: Restore SonarQube analyzer cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/.sonar/cache
          key: ${{ runner.os }}-${{ runner.arch }}-sonarqube-26.7-analyzers-v1

      - name: Analyze source with SonarQube
        id: sonarqube-scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_USER_HOME: ${{ runner.temp }}/.sonar
          SONAR_SCANNER_JAVA_OPTS: -Xmx512m
        with:
          args: >-
            -Dproject.settings=${{ runner.temp }}/sonar-project.properties
            -Dsonar.projectVersion=${{ env.SOURCE_SHA }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Retry SonarQube analysis once
        if: steps.sonarqube-scan.outcome == 'failure'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_USER_HOME: ${{ runner.temp }}/.sonar
          SONAR_SCANNER_JAVA_OPTS: -Xmx512m
        with:
          args: >-
            -Dproject.settings=${{ runner.temp }}/sonar-project.properties
            -Dsonar.projectVersion=${{ env.SOURCE_SHA }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Remove temporary SonarQube credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/sonarqube/client.p12"
          rm -f "$RUNNER_TEMP/sonar-project.properties"

      - name: Verify generated files are committed
        run: |
          if [[ -n $(git status --short --untracked-files=no) ]]; then
            echo "make test changed tracked files; run it locally and commit the result" >&2
            git status --short
            git diff
            exit 1
          fi

  build:
    name: Build and publish image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      short-sha: ${{ steps.identity.outputs.short-sha }}
      image-tag: ${{ steps.identity.outputs.image-tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Reclaim runner disk space
        uses: ./.github/actions/runner-cleanup

      - name: Define immutable image identity
        id: identity
        run: |
          short_sha=${SOURCE_SHA::8}
          echo "short-sha=$short_sha" >>"$GITHUB_OUTPUT"
          echo "image-tag=sha-$SOURCE_SHA" >>"$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=${{ steps.identity.outputs.image-tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}

      - name: Build and push linux/amd64 image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ steps.identity.outputs.image-tag }}
            REVISION=${{ env.SOURCE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Summarize published image
        run: |
          echo "### Published image" >>"$GITHUB_STEP_SUMMARY"
          echo '```text' >>"$GITHUB_STEP_SUMMARY"
          echo "${IMAGE_REPOSITORY}@${{ steps.build.outputs.digest }}" >>"$GITHUB_STEP_SUMMARY"
          echo '```' >>"$GITHUB_STEP_SUMMARY"

      - name: Record immutable promotion metadata
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ steps.identity.outputs.image-tag }}
          APPLICATION_PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          mkdir -p promotion-metadata
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg pr "$APPLICATION_PR" \
            --arg pr_url "$APPLICATION_PR_URL" \
            --arg source_sha "$SOURCE_SHA" \
            --arg image_repository "$IMAGE_REPOSITORY" \
            --arg image_tag "$IMAGE_TAG" \
            --arg image_digest "$IMAGE_DIGEST" \
            '{
              repository: $repository,
              application_pr: ($pr | tonumber),
              application_pr_url: $pr_url,
              source_sha: $source_sha,
              image_repository: $image_repository,
              image_tag: $image_tag,
              image_digest: $image_digest
            }' >promotion-metadata/image.json

      - name: Upload immutable promotion metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promotion-metadata-pr-${{ env.APPLICATION_PR }}-${{ env.SOURCE_SHA }}
          path: promotion-metadata/image.json
          if-no-files-found: error
          retention-days: 30

  trivy:
    name: Trivy image scan
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Trivy client
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: false

      - name: Scan immutable image through homelab Trivy
        id: scan
        continue-on-error: true
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          mkdir -p reports
          trivy image \
            --server "$TRIVY_SERVER_URL" \
            --custom-headers "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            --custom-headers "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --scanners vuln \
            --ignore-unfixed \
            --no-progress \
            --timeout 15m \
            --format json \
            --output reports/trivy.json \
            "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"

      - name: Render Trivy reports
        if: steps.scan.outcome == 'success'
        run: |
          trivy convert --format table --output reports/trivy.txt reports/trivy.json
          trivy convert --format sarif --output reports/trivy.sarif reports/trivy.json

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-${{ needs.build.outputs.image-tag }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify Trivy scan completed
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          if [[ $SCAN_OUTCOME != success ]]; then
            echo "Trivy could not complete the image scan" >&2
            exit 1
          fi

      - name: Summarize Trivy findings
        run: |
          critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' reports/trivy.json)
          high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' reports/trivy.json)
          {
            echo "### Trivy image scan (non-blocking)"
            echo
            echo "| Severity | Findings |"
            echo "| --- | ---: |"
            echo "| Critical | $critical |"
            echo "| High | $high |"
            echo
            echo "Full JSON, table, and SARIF reports are attached to this workflow run."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Send Trivy report to DefectDojo
        id: defectdojo
        continue-on-error: ${{ env.DEFECTDOJO_ENFORCE != 'true' }}
        env:
          DEFECTDOJO_API_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}
          DEFECTDOJO_ENGAGEMENT_ID: ${{ vars.DEFECTDOJO_ENGAGEMENT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: >-
          .github/scripts/defectdojo-reimport.sh
          "Trivy Scan"
          "Trivy image scan"
          reports/trivy.json

      - name: Summarize DefectDojo Trivy ingestion
        if: always()
        env:
          INGESTION_OUTCOME: ${{ steps.defectdojo.outcome }}
        run: |
          echo "DefectDojo Trivy ingestion: $INGESTION_OUTCOME" >>"$GITHUB_STEP_SUMMARY"

      - name: Enforce Trivy vulnerability gate
        if: env.TRIVY_ENFORCE == 'true'
        run: |
          trivy convert \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            reports/trivy.json

  promote-dev:
    name: Promote digest to lab-a dev
    needs:
      - build
      - trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      iac-revision: ${{ steps.merge.outputs.revision }}
      pull-request-url: ${{ steps.cpr.outputs.pull-request-url }}
    steps:
      - name: Checkout pipeline helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Create scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.IAC_PROMOTER_CLIENT_ID }}
          private-key: ${{ secrets.IAC_PROMOTER_PRIVATE_KEY }}
          owner: EmrhT
          repositories: ultimate-iac
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout GitOps repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.IAC_REPOSITORY }}
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: ultimate-iac

      - name: Update only the lab-a dev digest
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          cd ultimate-iac
          ../.github/scripts/update-podinfo-digest.sh \
            argocd/applications/podinfo/clusters/lab-a/dev/kustomization.yaml \
            "$IMAGE_DIGEST"
          kubectl kustomize argocd/applications/podinfo/clusters/lab-a/dev >/dev/null
          changed=$(git diff --name-only)
          [[ -z $changed || $changed == "argocd/applications/podinfo/clusters/lab-a/dev/kustomization.yaml" ]] || {
            echo "unexpected GitOps changes: $changed" >&2
            exit 1
          }

      - name: Open or update dev promotion PR
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: ultimate-iac
          base: main
          branch: promote/podinfo-lab-a-dev
          delete-branch: true
          commit-message: Promote podinfo sha-${{ needs.build.outputs.short-sha }} to lab-a dev
          title: Promote podinfo sha-${{ needs.build.outputs.short-sha }} to lab-a dev
          body: |
            Automated dev promotion for application PR #${{ env.APPLICATION_PR }}.

            Source: `${{ github.repository }}@${{ env.SOURCE_SHA }}`
            Application PR: `${{ github.event.pull_request.html_url }}`

            Image: `${{ env.IMAGE_REPOSITORY }}@${{ needs.build.outputs.digest }}`
          add-paths: |
            argocd/applications/podinfo/clusters/lab-a/dev/kustomization.yaml

      - name: Merge dev promotion and capture revision
        id: merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          if [[ -n $PR_NUMBER ]]; then
            gh pr merge "$PR_NUMBER" --repo "$IAC_REPOSITORY" --auto --squash
            for _ in {1..60}; do
              state=$(gh pr view "$PR_NUMBER" --repo "$IAC_REPOSITORY" --json state --jq .state)
              [[ $state == MERGED ]] && break
              [[ $state == CLOSED ]] && {
                echo "dev promotion PR closed without merging" >&2
                exit 1
              }
              sleep 10
            done
            [[ ${state:-} == MERGED ]] || {
              echo "dev promotion PR did not merge within 10 minutes" >&2
              exit 1
            }
            revision=$(gh pr view "$PR_NUMBER" --repo "$IAC_REPOSITORY" --json mergeCommit --jq .mergeCommit.oid)
          else
            current_digest=$(sed -nE 's/^[[:space:]]*digest: (sha256:[0-9a-f]{64})$/\1/p' \
              ultimate-iac/argocd/applications/podinfo/clusters/lab-a/dev/kustomization.yaml)
            [[ $current_digest == "$IMAGE_DIGEST" ]] || {
              echo "no dev PR was created and main does not contain the requested digest" >&2
              exit 1
            }
            revision=$(git -C ultimate-iac rev-parse HEAD)
          fi
          echo "revision=$revision" >>"$GITHUB_OUTPUT"

  deploy-dev:
    name: Deploy and verify lab-a dev
    needs:
      - build
      - promote-dev
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout pipeline helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Install pinned Argo CD CLI
        run: |
          curl --fail-with-body --location --retry 3 \
            --output /tmp/argocd \
            "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/argocd-linux-amd64"
          echo "d4cb1ac8002baab8afaca2da3de597b613df8459074bc7c6d96dc95161c2a33f  /tmp/argocd" | sha256sum --check
          install /tmp/argocd "$RUNNER_TEMP/argocd"
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"

      - name: Ask Argo CD to deploy dev
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ARGOCD_APP: podinfo-lab-a-dev
          IAC_REVISION: ${{ needs.promote-dev.outputs.iac-revision }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: .github/scripts/argocd-sync.sh

  dast:
    name: ZAP DAST on lab-a dev
    needs:
      - build
      - deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout pipeline helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Run in-cluster ZAP automation plan
        id: zap
        continue-on-error: true
        env:
          ZAP_API_KEY: ${{ secrets.ZAP_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: .github/scripts/zap-scan.sh

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-${{ needs.build.outputs.image-tag }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Send ZAP report to DefectDojo
        id: defectdojo
        if: always() && hashFiles('reports/zap.xml') != ''
        continue-on-error: ${{ env.DEFECTDOJO_ENFORCE != 'true' }}
        env:
          DEFECTDOJO_API_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}
          DEFECTDOJO_ENGAGEMENT_ID: ${{ vars.DEFECTDOJO_ENGAGEMENT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: >-
          .github/scripts/defectdojo-reimport.sh
          "ZAP Scan"
          "ZAP DAST lab-a-dev"
          reports/zap.xml

      - name: Summarize DefectDojo ZAP ingestion
        if: always()
        env:
          INGESTION_OUTCOME: ${{ steps.defectdojo.outcome }}
        run: |
          echo "DefectDojo ZAP ingestion: $INGESTION_OUTCOME" >>"$GITHUB_STEP_SUMMARY"

      - name: Enforce ZAP gate
        if: steps.zap.outcome != 'success'
        run: |
          echo "ZAP found a high-risk alert or could not complete its automation plan" >&2
          exit 1

      - name: Record successful dev security validation
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          mkdir -p promotion-decision
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg pr "$APPLICATION_PR" \
            --arg source_sha "$SOURCE_SHA" \
            --arg image_repository "$IMAGE_REPOSITORY" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg validated_at "$(date --utc --iso-8601=seconds)" \
            '{
              repository: $repository,
              application_pr: ($pr | tonumber),
              source_sha: $source_sha,
              image_repository: $image_repository,
              image_digest: $image_digest,
              environment: "lab-a-dev",
              dast: "success",
              validated_at: $validated_at
            }' >promotion-decision/dev-security-validation.json

      - name: Upload successful dev security validation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promotion-decision-pr-${{ env.APPLICATION_PR }}-${{ env.SOURCE_SHA }}
          path: promotion-decision/dev-security-validation.json
          if-no-files-found: error
          retention-days: 30

  pr-gate:
    name: PR delivery gate
    if: always()
    needs:
      - quality
      - build
      - trivy
      - promote-dev
      - deploy-dev
      - dast
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every delivery stage
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          PROMOTE_DEV_RESULT: ${{ needs.promote-dev.result }}
          DEPLOY_DEV_RESULT: ${{ needs.deploy-dev.result }}
          DAST_RESULT: ${{ needs.dast.result }}
        run: |
          failed=false
          for result in \
            "$QUALITY_RESULT" \
            "$BUILD_RESULT" \
            "$TRIVY_RESULT" \
            "$PROMOTE_DEV_RESULT" \
            "$DEPLOY_DEV_RESULT" \
            "$DAST_RESULT"; do
            [[ $result == success ]] || failed=true
          done

          if [[ $failed == true ]]; then
            printf '%s\n' \
              "quality=$QUALITY_RESULT" \
              "build=$BUILD_RESULT" \
              "trivy=$TRIVY_RESULT" \
              "promote-dev=$PROMOTE_DEV_RESULT" \
              "deploy-dev=$DEPLOY_DEV_RESULT" \
              "dast=$DAST_RESULT" >&2
            exit 1
          fi

          echo "All required checks passed for application PR #${APPLICATION_PR}."
